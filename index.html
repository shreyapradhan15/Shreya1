<style>

    @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Betania+Patmos&family=Caveat:wght@400..700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Dosis:wght@200..800&family=Edu+QLD+Hand:wght@400..700&family=Great+Vibes&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playwrite+DE+LA+Guides&family=Playwrite+NZ+Basic:wght@100..400&family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&family=Share+Tech&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap');

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(
        135deg, #c9a86b,#f3b6a0, #8b0000 );
    font-family: Arial, sans-serif;
}

.page {
    width: 90%;
    max-width: 700px;
    text-align: center;
    padding: 70px 30px;
    background: rgba(255, 255, 255, 0.9);
    border: 3px solid #8b0000;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    transition: 0.5s;
}

.page:hover {
    box-shadow: 0 15px 40px rgba(139, 0, 0, 0.5);
    transform: translateY(-5px);
}

.page h1 {
    font-size: 30px;
    color: #8b0000;
    margin-bottom: 15px;
    letter-spacing: 10px;
     font-family: "Noto Sans Bengali", sans-serif;
}

.page h2 {
    font-size: 28px;
    color: #d35400;
    margin-bottom: 20px;
}

.page p {
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 30px;
    font-family: "Playwrite NZ Basic", cursive;
}

.page button {
    padding: 13px 30px;
    border: none;
    border-radius: 25px;
    background: #e61111;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.4s;
   }

.page button:hover {
    background: #d35400;
    box-shadow: 0 5px 15px rgba(211, 84, 0, 0.5);
    transform: scale(1.05);
}
.page button a{
    color: black;
    text-decoration: none;
}

.page img{
    height: 100px;
    width: 100px;
    object-fit: contain;
    display: block;
    margin: 15px auto;
    border-radius: 10px;
}
</style>
</head>
